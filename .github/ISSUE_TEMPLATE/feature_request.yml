name: Feature proposal
description: Propose a focused improvement backed by a real concurrency-testing need
title: "[Proposal]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What real Laravel race condition or workflow cannot be tested well today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example API or scenario
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Safety and compatibility considerations
      description: Consider production refusal, database writes, worker protocol, and public API impact.
    validations:
      required: true
