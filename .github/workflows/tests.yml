name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar --extract --gzip --file "${archive}" gitleaks

      - name: Scan current files and reachable history
        run: |
          ./gitleaks dir . --no-banner --redact
          ./gitleaks git . --no-banner --redact

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '^12.0'
            testbench: '^10.0'
          - php: '8.5'
            laravel: '^13.0'
            testbench: '^11.0'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - run: composer validate --strict
      - run: composer update --with "illuminate/support:${{ matrix.laravel }}" --with "orchestra/testbench:${{ matrix.testbench }}" --with-all-dependencies --prefer-dist --no-interaction --no-progress
      - run: composer audit --locked --no-interaction
      - name: Run PHPUnit, Pest, Pint, and PHPStan
        run: composer check

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: xdebug
          tools: composer:v2

      - run: composer update --with "illuminate/support:^13.0" --with "orchestra/testbench:^11.0" --with-all-dependencies --prefer-dist --no-interaction --no-progress
      - run: composer test:coverage

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-clover
          path: build/coverage/clover.xml
          if-no-files-found: warn
          retention-days: 14

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: xdebug
          tools: composer:v2

      - run: composer update --with "illuminate/support:^13.0" --with "orchestra/testbench:^11.0" --with-all-dependencies --prefer-dist --no-interaction --no-progress
      - name: Mutate release-critical safety classes
        run: |
          mkdir -p build/mutation
          set -o pipefail
          composer test:mutation 2>&1 | tee build/mutation/report.txt
          php tools/check-mutation.php build/mutation/report.txt 80

      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-evidence
          path: build/mutation/report.txt
          if-no-files-found: error
          retention-days: 30

  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install only the consumer application's dependencies
        run: composer consumer:install
      - run: composer audit --working-dir=tests/ConsumerApp --locked --no-interaction
      - name: Exercise package discovery, auth, CLI, races, and Studio
        run: composer --working-dir=tests/ConsumerApp check
      - name: Verify consumer cleanup preserves tracked fixtures
        run: git diff --exit-code -- tests/ConsumerApp

  redis:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30

    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_DB: 15
      RACEPROOF_REDIS_TEST: '1'
      RACEPROOF_REDIS_EVIDENCE_OUTPUT: build/redis-evidence/evidence.json
      RACEPROOF_COORDINATOR_DRIVER: redis
      RACEPROOF_REDIS_CONNECTION: default
      RACEPROOF_REDIS_NAMESPACE: raceproof-consumer-ci
      RACEPROOF_REDIS_TTL_SECONDS: 300
      RACEPROOF_REDIS_POLL_INTERVAL_MS: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: pdo_sqlite, redis
          tools: composer:v2

      - run: composer update --with "illuminate/support:^13.0" --with "orchestra/testbench:^11.0" --with-all-dependencies --prefer-dist --no-interaction --no-progress
      - name: Verify the atomic Redis coordinator contract
        run: composer test:redis
      - name: Install only the consumer application's dependencies
        run: composer consumer:install
      - run: composer audit --working-dir=tests/ConsumerApp --locked --no-interaction
      - name: Exercise a real multi-process consumer through Redis
        run: composer --working-dir=tests/ConsumerApp check

      - name: Exercise the consumer through independent remote worker agents
        env:
          RACEPROOF_WORKER_TRANSPORT: remote
          RACEPROOF_REMOTE_AGENTS: agent-a,agent-b
          RACEPROOF_REMOTE_NAMESPACE: raceproof-remote-consumer-ci
          RACEPROOF_REMOTE_MESSAGE_TTL_MS: 15000
          RACEPROOF_REMOTE_STATE_TTL_SECONDS: 300
          RACEPROOF_REMOTE_HEARTBEAT_TTL_MS: 5000
          RACEPROOF_REMOTE_POLL_INTERVAL_MS: 10
        run: |
          mkdir -p build/remote-worker-evidence
          export RACEPROOF_REMOTE_SECRET="$(openssl rand -hex 32)"
          php tests/ConsumerApp/artisan raceproof:worker-agent \
            --id=agent-a \
            --idle-timeout-ms=120000 \
            > build/remote-worker-evidence/agent-a.log 2>&1 &
          agent_a_pid=$!
          php tests/ConsumerApp/artisan raceproof:worker-agent \
            --id=agent-b \
            --idle-timeout-ms=120000 \
            > build/remote-worker-evidence/agent-b.log 2>&1 &
          agent_b_pid=$!
          cleanup_agents() {
            kill "$agent_a_pid" "$agent_b_pid" 2>/dev/null || true
            wait "$agent_a_pid" "$agent_b_pid" 2>/dev/null || true
          }
          trap cleanup_agents EXIT
          ready=0
          for attempt in $(seq 1 100); do
            if php tests/ConsumerApp/artisan raceproof:doctor --json \
              > build/remote-worker-evidence/doctor.json; then
              ready=1
              break
            fi
            sleep 0.1
          done
          test "$ready" -eq 1
          php tests/ConsumerApp/vendor/bin/phpunit \
            --configuration=tests/ConsumerApp/phpunit.xml \
            --filter=ConsumerAcceptanceTest \
            --log-junit="$GITHUB_WORKSPACE/build/remote-worker-evidence/junit.xml"

      - name: Verify consumer cleanup preserves tracked fixtures
        run: git diff --exit-code -- tests/ConsumerApp

      - name: Upload Redis coordination evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redis-coordination-evidence
          path: build/redis-evidence/evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload remote worker transport evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: remote-worker-transport-evidence
          path: build/remote-worker-evidence
          if-no-files-found: warn
          retention-days: 30

  platform-smoke:
    name: platform-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: fileinfo, pdo_sqlite
          tools: composer:v2

      - name: Install only the consumer application's dependencies
        run: composer consumer:install
      - run: composer audit --working-dir=tests/ConsumerApp --locked --no-interaction
      - name: Exercise package discovery, auth, CLI, races, and Studio
        run: composer --working-dir=tests/ConsumerApp check
      - name: Verify consumer cleanup preserves tracked fixtures
        run: git diff --exit-code -- tests/ConsumerApp

  release-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: zip
          tools: composer:v2

      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer release:dry-run

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: mysql
            image: mysql:8.4
            port: 3306
            username: root
            options: >-
              --health-cmd "mysqladmin ping -h 127.0.0.1 -praceproof"
              --health-interval 2s
              --health-timeout 2s
              --health-retries 30
          - engine: pgsql
            image: postgres:17
            port: 5432
            username: postgres
            options: >-
              --health-cmd "pg_isready -U postgres -d raceproof_test"
              --health-interval 2s
              --health-timeout 2s
              --health-retries 30

    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_DATABASE: raceproof_test
          MYSQL_ROOT_PASSWORD: raceproof
          POSTGRES_DB: raceproof_test
          POSTGRES_PASSWORD: raceproof
        ports:
          - "${{ matrix.port }}:${{ matrix.port }}"
        options: ${{ matrix.options }}

    env:
      DB_CONNECTION: ${{ matrix.engine }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_DATABASE: raceproof_test
      DB_USERNAME: ${{ matrix.username }}
      DB_PASSWORD: raceproof
      RACEPROOF_REQUIRE_DATABASE_ALLOWLIST: 'true'
      RACEPROOF_ALLOWED_DATABASES: raceproof_test
      RACEPROOF_EVIDENCE_ITERATIONS: 100
      RACEPROOF_EXCHANGE_PARTICIPANTS: '10,25'
      RACEPROOF_EVIDENCE_OUTPUT: build/database-evidence/${{ matrix.engine }}.json

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: pdo_mysql, pdo_pgsql
          tools: composer:v2

      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer test:database

      - name: Upload database evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: database-evidence-${{ matrix.engine }}
          path: build/database-evidence/${{ matrix.engine }}.json
          if-no-files-found: warn
          retention-days: 30

  release-audit:
    needs:
      - secret-scan
      - tests
      - coverage
      - mutation
      - consumer
      - redis
      - platform-smoke
      - release-dry-run
      - database
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer release:audit

      - name: Upload pre-release audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-audit-evidence
          path: build/release-audit/evidence.json
          if-no-files-found: error
          retention-days: 30
