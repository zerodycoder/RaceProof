name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '^12.0'
            testbench: '^10.0'
          - php: '8.5'
            laravel: '^13.0'
            testbench: '^11.0'

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - run: composer validate --strict
      - run: composer require --no-update "illuminate/support:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}"
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: composer audit --locked --no-interaction
      - run: composer check

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: xdebug
          tools: composer:v2

      - run: composer require --no-update "illuminate/support:^13.0" "orchestra/testbench:^11.0"
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: composer test:coverage

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-clover
          path: build/coverage/clover.xml
          if-no-files-found: warn
          retention-days: 14
