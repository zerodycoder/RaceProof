name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '^12.0'
            testbench: '^10.0'
          - php: '8.5'
            laravel: '^13.0'
            testbench: '^11.0'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - run: composer validate --strict
      - run: composer update --with "illuminate/support:${{ matrix.laravel }}" --with "orchestra/testbench:${{ matrix.testbench }}" --with-all-dependencies --prefer-dist --no-interaction --no-progress
      - run: composer audit --locked --no-interaction
      - name: Run PHPUnit, Pest, Pint, and PHPStan
        run: composer check

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: xdebug
          tools: composer:v2

      - run: composer update --with "illuminate/support:^13.0" --with "orchestra/testbench:^11.0" --with-all-dependencies --prefer-dist --no-interaction --no-progress
      - run: composer test:coverage

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-clover
          path: build/coverage/clover.xml
          if-no-files-found: warn
          retention-days: 14

  release-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: zip
          tools: composer:v2

      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer release:dry-run

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: mysql
            image: mysql:8.4
            port: 3306
            username: root
            options: >-
              --health-cmd "mysqladmin ping -h 127.0.0.1 -praceproof"
              --health-interval 2s
              --health-timeout 2s
              --health-retries 30
          - engine: pgsql
            image: postgres:17
            port: 5432
            username: postgres
            options: >-
              --health-cmd "pg_isready -U postgres -d raceproof_test"
              --health-interval 2s
              --health-timeout 2s
              --health-retries 30

    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_DATABASE: raceproof_test
          MYSQL_ROOT_PASSWORD: raceproof
          POSTGRES_DB: raceproof_test
          POSTGRES_PASSWORD: raceproof
        ports:
          - "${{ matrix.port }}:${{ matrix.port }}"
        options: ${{ matrix.options }}

    env:
      DB_CONNECTION: ${{ matrix.engine }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_DATABASE: raceproof_test
      DB_USERNAME: ${{ matrix.username }}
      DB_PASSWORD: raceproof
      RACEPROOF_REQUIRE_DATABASE_ALLOWLIST: 'true'
      RACEPROOF_ALLOWED_DATABASES: raceproof_test
      RACEPROOF_EVIDENCE_ITERATIONS: 100
      RACEPROOF_EVIDENCE_OUTPUT: build/database-evidence/${{ matrix.engine }}.json

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: pdo_mysql, pdo_pgsql
          tools: composer:v2

      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer test:database

      - name: Upload database evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: database-evidence-${{ matrix.engine }}
          path: build/database-evidence/${{ matrix.engine }}.json
          if-no-files-found: warn
          retention-days: 30

  release-audit:
    needs:
      - tests
      - coverage
      - release-dry-run
      - database
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer release:audit

      - name: Upload pre-release audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-audit-evidence
          path: build/release-audit/evidence.json
          if-no-files-found: error
          retention-days: 30
